name: farmfeed
description: FarmFeed - Livestock Feed Optimization & Production Analysis for Zimbabwe
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP & Networking
  dio: ^5.4.3
  
  # Local Storage
  shared_preferences: ^2.3.0
  
  # Navigation
  go_router: ^13.2.0
  
  # State Management
  provider: ^6.1.2
  
  # Design & Typography
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  
  # Charts
  fl_chart: ^0.68.0
  
  # UI utilities
  cupertino_icons: ^1.0.6
  shimmer: ^3.0.0
  
  # Utilities
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "images/logo.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#2E7D32"
  image: "images/logo.png"
  android: true
  ios: false
  fullscreen: true

flutter:
  uses-material-design: true
  assets:
    - images/
    - images/logo.png
